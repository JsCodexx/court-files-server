# Nginx reverse proxy for Court Files API (EC2).
# Install: sudo cp deploy/nginx-api.conf /etc/nginx/sites-available/court-files-api
#          sudo ln -sf /etc/nginx/sites-available/court-files-api /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace api.yourdomain.com with your API hostname.
# After DNS points here, enable TLS:
#   sudo certbot --nginx -d api.yourdomain.com

upstream court_files_api {
    server 127.0.0.1:5500;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://court_files_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /api/health {
        proxy_pass http://court_files_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
