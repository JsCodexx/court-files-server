name: Deploy Backend to EC2

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-ec2
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Prepare deploy package
        run: |
          mkdir -p deploy-bundle
          cp -r dist package.json package-lock.json ecosystem.config.cjs deploy-bundle/
          # Optional: ship SQL migrations for manual/server-side apply
          if [ -d drizzle ]; then
            cp -r drizzle deploy-bundle/
          fi
          # Do NOT copy .env — secrets live only on the EC2 host

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          APP_DIR="${APP_DIR:-/var/www/court-files-server}"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=accept-new" \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.git' \
            deploy-bundle/ \
            "${EC2_USER}@${EC2_HOST}:${APP_DIR}/"

      - name: Install deps & restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            APP_DIR="${APP_DIR:-/var/www/court-files-server}"
            cd "$APP_DIR"
            if [ ! -f .env ]; then
              echo "ERROR: $APP_DIR/.env is missing on the server. Create it before deploying."
              exit 1
            fi
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.cjs --env production
            pm2 save
            pm2 status
